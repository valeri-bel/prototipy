<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Каталог протеиновых каш — My Time</title>
</head>
<body data-page="catalog">
<header id="site-header"></header>
<main class="wrap">
  <div class="page-head"><h1>Каталог</h1><p>Выбирайте по&nbsp;крупе и&nbsp;формату. Показана часть линейки для&nbsp;примера.</p></div>
  <div class="cat">
    <aside class="side">
      <input type="search" id="f-search" placeholder="Вкус или ингредиент" aria-label="Поиск по каталогу">
      <h4>Формат</h4><div class="chips" id="f-group"></div>
      <h4>Крупа</h4><div class="chips" id="f-cereal"></div>
      <label class="toggle"><input type="checkbox" id="f-nooat"> Без&nbsp;овсянки</label>
      <h4 style="margin-top:20px">Сортировка</h4>
      <select id="f-sort" aria-label="Сортировка"><option value="pop">Сначала популярные</option><option value="portion">Дешевле за&nbsp;порцию</option><option value="price">Дешевле за&nbsp;упаковку</option></select>
      <button class="reset" id="reset">Сбросить</button>
    </aside>
    <div>
      <div class="cat-top"><span>Показано: <b id="result"></b></span></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="js/typo.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
